name: Release production

# Branch pushes and manual workflow runs cannot start a production release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and required credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a release tag such as v1.0.0"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "Release tags must point to a commit on main"; exit 1; }
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID RENDER_API_KEY RENDER_SERVICE_ID; do
            [[ -n "${!name}" ]] || { echo "Missing production secret: $name"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.2.0
      - name: Build tagged web application on Vercel without promoting
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          # Secret variables cannot be read back by vercel pull. Build on Vercel
          # so its build process can access them without exporting them to CI.
          url=$(vercel deploy --yes --prod --skip-domain --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN")
          [[ "$url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]] || { echo "Vercel returned an unexpected deployment URL"; exit 1; }
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Verify candidate access in the production team
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel inspect "$DEPLOYMENT_URL" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
      - name: Deploy tagged worker and wait until live
        run: node scripts/deploy-render-cli.mjs
      - name: Promote tagged web application
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          vercel promote "$DEPLOYMENT_URL" --yes --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          echo "### Released $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
